<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TV, console and eARC connection planner by Elechid Hong Kong. Free, bilingual and open source.">
<title>TV, console and eARC connection planner | Elechid 音立</title>
<style>
:root { color: #152624; background: #edf4ef; font: 16px/1.55 system-ui,sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 60rem; margin: auto; padding: clamp(1rem,5vw,3.5rem); }
header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
h1 { font-size: clamp(2rem,6vw,3.5rem); line-height: 1.08; letter-spacing: -.03em; margin-bottom: .4em; }
p { max-width: 66ch; }
form, .results { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,13rem),1fr)); gap: .8rem; margin-block: 1.5rem; }
label, .results div { display: block; padding: .9rem 1rem; background: #fff; border: 1px solid #bbcfc4; border-radius: .75rem; }
label { font-weight: 600; }
input, button { font: inherit; color: inherit; border: 1px solid #58766a; border-radius: .4rem; background: #fff; padding: .45rem .65rem; }
input { display: block; margin-top: .4rem; width: 100%; }
button { cursor: pointer; }
a { color: #075238; text-underline-offset: .17em; }
output { display: block; font-size: 1.7rem; font-weight: 750; overflow-wrap: anywhere; }
#error { color: #a42125; }

nav { display:flex; flex-wrap:wrap; gap:.5rem 1rem; margin-top:1rem; }
nav a[aria-current] { font-weight:750; }
output { font-size:1.35rem; }
textarea { width:100%; min-height:13rem; padding:.75rem; font:inherit; }
form:empty,.results:empty { display:none; }
</style>
<script type="module" src="./app.mjs"></script>
</head>
<body><main>
<header><a id="brand" href="https://elechid.com/en/">Elechid 音立</a><button type="button" id="language" lang="zh-Hant">繁體中文</button></header>
<h1 id="title">TV, console and eARC connection planner</h1>
<p id="intro"></p>
<form></form>
<p id="error" role="status" hidden></p>
<section class="results" aria-live="polite"></section>
<section id="checklist" hidden>
<label id="list-label" for="measurements">Measurement record</label>
<textarea id="measurements" readonly></textarea>
<button id="copy" type="button">Copy checklist</button>
<p id="copy-status" role="status"></p>
</section>
<p id="note"></p>
<noscript>JavaScript is required. 此工具需要 JavaScript。</noscript>
<p><a id="guide" href="https://elechid.com/en/blogs/news/tv-connection-guide-hong-kong-hdmi-cables-earc-soundbars-consoles">Read the Elechid guide</a> · <a id="source" href="https://github.com/Elechid/tv-hdmi-connection-planner">Source code</a></p>
</main></body></html>
